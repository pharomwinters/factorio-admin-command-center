# .github/workflows/release.yml
name: Zip and Upload Mod

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para o nome do arquivo (ex: 1.0.1)"
        required: true
        type: string

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Define version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
          fi

      # git archive honors export-ignore in .gitattributes, which keeps out
      # the dev files (ps1, sh, ...) that the mod portal rejects
      - name: Zip mod
        run: |
          git archive --format=zip --prefix=facc-redux/ -o "facc-redux_${{ steps.version.outputs.value }}.zip" HEAD

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          files: facc-redux_${{ steps.version.outputs.value }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
